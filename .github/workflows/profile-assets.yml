name: Update profile assets

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-assets.yml'
      - 'scripts/profile_assets.py'

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ErickMurakami/ErickMurakami'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate the original compact languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ErickMurakami&langs_count=8&layout=compact&card_width=495&theme=dark&border_color=41454B&bg_color=1B1C1E&title_color=C4C7CC&text_color=E5E7EB&icon_color=C4C7CC&disable_animations=false
          path: assets/top-languages.svg
          # Optional PAT for private repositories; otherwise public stats only.
          # Store it in Settings > Secrets and variables > Actions, never here.
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Refresh animated streak and validate SVGs
        run: python3 scripts/profile_assets.py
      - name: Publish only validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/streak.svg assets/streak-light.svg assets/top-languages.svg assets/top-languages-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile activity cards'
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
